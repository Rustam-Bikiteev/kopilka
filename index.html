<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#120c08" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;700;800&family=Playfair+Display:wght@700;800&family=Press+Start+2P&display=swap" rel="stylesheet" />
    <title>Копилка</title>
  </head>
  <body>
    <div id="stage"></div>

    <header id="hud" class="hud">
      <div class="hud-row">
        <label class="goal">
          <span class="goal-label">Копим на ✎</span>
          <input id="goalName" class="goal-name inline-field" maxlength="24" autocomplete="off" enterkeyhint="done" aria-label="Название цели" />
        </label>
        <div class="top-actions">
          <button id="motionBtn" class="icon-btn" aria-label="Наклон">
            <svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5" transform="rotate(-18 12 12)"/><path d="M3 9a9 9 0 0 1 2-4M21 15a9 9 0 0 1-2 4"/></svg>
          </button>
          <button id="photoBtn" class="icon-btn armable" aria-label="Фото цели">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 16l5-5 4 4 3-3 6 6"/><path d="M15.5 9.5h.01"/></svg>
            <span id="photoText" class="arm-text"></span>
          </button>
          <input id="fPhoto" type="file" accept="image/*" hidden />
          <button id="themeBtn" class="icon-btn" aria-label="Сменить тему">
            <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.3 0 2-1 2-2 0-1.4-1.2-1.6-1.2-2.8 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><path d="M7.5 11h.01M10 7.5h.01M14.5 7.5h.01"/></svg>
          </button>
        </div>
      </div>
      <div class="amount-row">
        <div class="amount"><span id="amount">0</span><span class="cur">₽</span></div>
        <span id="combo" class="combo"></span>
      </div>
      <div class="target">
        из <input id="target" class="inline-field target-field" inputmode="numeric" autocomplete="off" enterkeyhint="done" aria-label="Цель, рублей" /> ₽ <span class="dot"></span> <span id="pct">0%</span>
        <span id="lucky" class="lucky" hidden></span>
      </div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="pager-row">
        <nav id="pager" class="pager" aria-label="Копилки"></nav>
        <button id="cycleBtn" class="cycle-btn" aria-label="Следующая копилка">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg>
        </button>
      </div>
    </header>

    <footer id="controls" class="controls">
      <div class="chips">
        <button class="chip" data-add="10">+10</button>
        <button class="chip" data-add="50">+50</button>
        <button class="chip" data-add="100">+100</button>
        <button class="chip" data-add="500">+500</button>
        <button id="customBtn" class="chip">Своя</button>
      </div>
      <div class="main-row">
        <button id="shakeBtn" class="side-btn">
          <svg viewBox="0 0 24 24"><path d="M9 4h6l1 3v11a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2V7z"/><path d="M4 9l-2 3 2 3M20 9l2 3-2 3"/></svg>
          <span>Встряхнуть</span>
        </button>
        <button id="pourBtn" class="pour" aria-label="Сыпать монеты">
          <span class="pour-coin"><b>₽</b></span>
          <span id="pourCount" class="pour-count"></span>
        </button>
        <button id="resetBtn" class="side-btn reset-btn">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>
          <span id="resetText">Обнулить</span>
        </button>
      </div>
    </footer>

    <div id="floaters"></div>
    <div id="toast" class="toast"></div>
    <div id="withdraw" class="withdraw"></div>
    <div id="undo" class="undo" hidden>
      <span id="undoText"></span>
      <button id="undoBtn" type="button">Вернуть</button>
    </div>

    <div id="goalCard" class="goal-card" hidden>
      <div class="goal-card-inner">
        <div class="goal-card-badge">100%</div>
        <h2>Цель достигнута!</h2>
        <p id="goalCardText"></p>
        <div class="sheet-actions">
          <button id="goalMore" type="button" class="ghost">Копить дальше</button>
          <button id="goalNew" type="button" class="primary">Новая копилка</button>
        </div>
      </div>
    </div>

    <dialog id="amountDlg">
      <form method="dialog" class="sheet">
        <h2>Своя сумма</h2>
        <label>Сколько положить, ₽<input id="fAmount" type="number" inputmode="numeric" min="1" step="1" placeholder="Например, 2500" /></label>
        <div class="sheet-actions">
          <button value="cancel" class="ghost" formnovalidate>Отмена</button>
          <button value="add" class="primary">Положить</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
